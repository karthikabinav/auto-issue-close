name: Auto Close Issues

on:
  issues:
    types: [opened, labeled, reopened]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Automatically close issues with completed or wontfix labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            if (!issue) {
              console.log("No issue in payload");
              return;
            }
            const labels = issue.labels.map(l => l.name);
            console.log(`Issue #${issue.number} labels: ${labels.join(", ")}`);
            if (labels.includes("completed") || labels.includes("wontfix")) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed"
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "This issue was automatically closed because it was labeled as `completed` or `wontfix`."
              });
              console.log(`Closed issue #${issue.number}`);
            } else {
              console.log("No auto-close label found");
            }
