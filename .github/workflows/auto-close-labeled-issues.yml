name: Auto Close Labeled Issues

on:
  issues:
    types: [opened, labeled]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  close-labeled-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Close issues labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          script: |
            const TARGET_LABELS = new Set(['completed', 'wontfix']);
            const closeIssue = async (issueNumber) => {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed',
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: 'This issue was automatically closed because it was labeled as `completed` or `wontfix`.',
              });
            };
            if (context.eventName === 'schedule' || context.eventName === 'workflow_dispatch') {
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
              });
              for (const issueItem of issues) {
                if (issueItem.labels.some(label => TARGET_LABELS.has(label.name))) {
                  await closeIssue(issueItem.number);
                }
              }
              return;
            }
            const issue = context.payload.issue;
            if (!issue || issue.state === 'closed') return;
            if (issue.labels.some(label => TARGET_LABELS.has(label.name))) {
              await closeIssue(issue.number);
            }
