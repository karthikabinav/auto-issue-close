name: Auto-close labeled issues

on:
  schedule:
    - cron: "0 0 * * *"
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  close-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Close issues labeled completed or wontfix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          for label in completed wontfix; do
            echo "Checking open issues labeled: $label"
            for issue_number in $(gh issue list \
              --label "$label" \
              --state open \
              --limit 100 \
              --json number \
              --jq ".[].number"); do
              gh issue close "$issue_number" \
                --comment "Automatically closed: this issue is labeled $label."
              echo "Closed issue #$issue_number (label: $label)"
            done
          done
