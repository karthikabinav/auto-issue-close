name: Auto-close labeled issues

on:
  issues:
    types: [labeled]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  close-labeled-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Close issues labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          script: |
            const TARGET_LABELS = new Set([completed, wontfix]);
            const isClosed = (label) => TARGET_LABELS.has(label.name);
            const issue = context.payload.issue;
            const closeIssue = async (issueNumber) => {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: closed,
              });
            };

            if (context.eventName === schedule || context.eventName === workflow_dispatch) {
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: open,
              });
              const closeableIssues = issues.filter(issueItem => issueItem.labels.some(isClosed));
              for (const issueItem of closeableIssues) {
                await closeIssue(issueItem.number);
              }
              return;
            }

            if (!issue || issue.state === closed) {
              return;
            }
            if (issue.labels.some(isClosed)) {
              await closeIssue(issue.number);
            }
