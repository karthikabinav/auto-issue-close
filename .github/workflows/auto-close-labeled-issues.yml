name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  close-issue:
    name: Close issues labeled completed or wontfix
    if: github.event.label.name == 'completed' || github.event.label.name == 'wontfix'
    runs-on: ubuntu-latest
    steps:
      - name: Close the issue
        uses: actions/github-script@v7
        with:
          script: |
            const label = context.payload.label.name;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Automatically closing this issue because it was labeled as " + label + "."
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });
