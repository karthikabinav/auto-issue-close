name: Auto Close Labeled Issues

on:
  issues:
    types: [opened, labeled, reopened]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  auto-close:
    runs-on: ubuntu-latest
    steps:
      - name: Close issue if labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name);
            if (labels.includes("completed") || labels.includes("wontfix")) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                state: "closed"
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: "Automatically closing this issue because it is labeled as completed or wontfix."
              });
            }
