name: Student Auto Close Labeled Issues
on:
  issues:
    types: [opened, labeled, edited, reopened]
  workflow_dispatch:

jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check labels and close issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            if (!issue) {
              console.log("No issue in payload");
              return;
            }
            const labels = issue.labels.map(l => l.name);
            console.log(`Found labels: ${labels.join(", ")}`);
            if (labels.includes("completed") || labels.includes("wontfix")) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "✅ Automatically closed by GitHub automation: This issue was labeled as `completed` or `wontfix`."
              });
              console.log(`Closed issue #${issue.number}`);
            } else {
              console.log("Issue does not have completed/wontfix label, leaving open.");
            }
