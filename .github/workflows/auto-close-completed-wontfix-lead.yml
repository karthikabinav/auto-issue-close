name: Auto-close labeled issues

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  auto-close:
    if: github.event.label.name == 'completed' || github.event.label.name == 'wontfix'
    runs-on: ubuntu-latest
    steps:
      - name: Close issue for completed or wontfix label
        uses: actions/github-script@v7
        with:
          script: |
            const label = context.payload.label.name;
            if (!['completed', 'wontfix'].includes(label)) {
              core.info(`Label '${label}' does not trigger auto-close.`);
              return;
            }
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: label === 'wontfix' ? 'not_planned' : 'completed'
            });
