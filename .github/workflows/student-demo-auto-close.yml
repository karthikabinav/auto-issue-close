name: Student Demo Auto Close Labeled Issues

on:
  issues:
    types: [labeled, opened]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check label and close issue
        uses: actions/github-script@v7
        with:
          script: |
            const labelNames = context.payload.issue ? context.payload.issue.labels.map(l => l.name) : [context.payload.label.name];
            if (labelNames.includes("completed") || labelNames.includes("wontfix")) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: "closed"
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: "🤖 This issue was automatically closed by GitHub Actions because it was labeled as completed or wontfix."
              });
            }
