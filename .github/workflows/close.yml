name: Auto Close
on: [issues]
permissions:
  issues: write
jobs:
  close:
    if: github.event.label.name == 'completed' || github.event.label.name == 'wontfix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed'})
