name: Auto Close Completed and Wontfix Issues

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  auto-close:
    if: contains(github.event.label.name, 'completed') || contains(github.event.label.name, 'wontfix')
    runs-on: ubuntu-latest
    steps:
      - name: Close issue with completed/wontfix label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Automatically closed due to `completed` or `wontfix` label.`'
            });
