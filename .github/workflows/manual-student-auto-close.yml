name: Auto Close Completed and Wontfix Issues
on:
  issues:
    types: [opened, labeled, reopened]
jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issue if completed or wontfix
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            if (!issue) return;
            const labels = issue.labels.map(l => l.name);
            console.log(`Checking issue #${issue.number} with labels: ${labels.join(", ")}`);
            if (labels.includes("completed") || labels.includes("wontfix")) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed"
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "Automatically closed by workflow: labeled as `completed` or `wontfix`."
              });
              console.log(`Closed issue #${issue.number}`);
            } else {
              console.log(`Issue #${issue.number} did not match closing criteria`);
            }
