name: Auto Close Completed and Wontfix Issues

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  close-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Close issue if labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            if (!issue) {
              core.info("No issue in payload, skipping.");
              return;
            }
            const labels = issue.labels.map(l => typeof l === "string" ? l : l.name);
            if (labels.includes("completed") || labels.includes("wontfix")) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });
              core.info(`Closed issue #${issue.number} with labels: ${labels.join(", ")}`);
            } else {
              core.info(`Issue #${issue.number} does not have completed/wontfix label, leaving open.`);
            }
