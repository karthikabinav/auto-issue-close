name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled, opened]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  close-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issues with completed/wontfix labels
        uses: actions/github-script@v7
        with:
          script: |
            const labelsToClose = ["completed", "wontfix"];
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open"
            });
            for (const issue of issues) {
              if (issue.pull_request) continue;
              const issueLabels = issue.labels.map(l => typeof l === "string" ? l : l.name);
              if (issueLabels.some(label => labelsToClose.includes(label))) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "closed"
                });
                console.log(`Closed issue #${issue.number}`);
              }
            }
