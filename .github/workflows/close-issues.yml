name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled]

jobs:
  close-issue:
    if: contains('completed,wontfix', github.event.label.name)
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close labeled issue
        uses: actions/github-script@v7
        with:
          script: |
            const label = context.payload.label.name;
            if (label === 'completed' || label === 'wontfix') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `This issue was automatically closed because it was labeled as **${label}**.`
              });
            }