name: Close labeled issues
on:
  issues:
    types: [labeled]
jobs:
  close:
    if: github.event.label.name == "completed" || github.event.label.name == "wontfix"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python close_issues.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
