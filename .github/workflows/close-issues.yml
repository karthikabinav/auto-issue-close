name: Auto Close Issues

on:
  issues:
    types: [opened, labeled, edited, reopened]

jobs:
  close_issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close completed or wontfix issues
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) {
              console.log("No issue found in payload");
              return;
            }
            const labels = issue.labels.map(label => label.name);
            console.log(`Issue #${issue.number} labels: ${labels.join(", ")}`);
            if (labels.includes("completed") || labels.includes("wontfix")) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "🤖 This issue has been automatically closed because it is labeled as `completed` or `wontfix`."
              });
              console.log(`Closed issue #${issue.number}`);
            } else {
              console.log("Issue does not have target labels, skipping.");
            }
