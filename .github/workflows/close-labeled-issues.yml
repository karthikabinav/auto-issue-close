name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled]

jobs:
  close-issue:
    runs-on: ubuntu-latest
    if: contains(fromJSON('["completed", "wontfix"]'), github.event.label.name)
    steps:
      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
            const label = context.payload.label.name;
            let comment = '';
            if (label === 'completed') {
              comment = 'This issue has been marked as completed and is now closed.';
            } else if (label === 'wontfix') {
              comment = 'This issue has been marked as wontfix and is now closed.';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
