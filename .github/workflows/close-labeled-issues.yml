name: Auto Close Labeled Issues

on:
  issues:
    types: [opened, reopened, labeled]

permissions:
  issues: write

jobs:
  close-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Close issue when labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(label => label.name.toLowerCase());
            const shouldClose = labels.includes('completed') || labels.includes('wontfix');

            if (shouldClose && issue.state === 'open') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: labels.includes('completed') ? 'completed' : 'not_planned'
              });
            }
