name: Auto Close Completed and Wontfix Issues

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  auto-close:
    runs-on: ubuntu-latest
    steps:
      - name: Close issue if labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name.toLowerCase());
            if (labels.includes("completed") || labels.includes("wontfix")) {
              console.log(`Closing issue #${context.payload.issue.number} with labels: ${labels}`);
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                state: "closed"
              });
            } else {
              console.log(`Keeping issue #${context.payload.issue.number} open. Labels: ${labels}`);
            }
