name: Automated Issue Closing

on:
  issues:
    types: [opened, labeled]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issues labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name);
            const labelsToClose = ['completed', 'wontfix'];
            const matched = labels.find(label => labelsToClose.includes(label));
            if (matched) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `This issue was automatically closed because it was labeled as ${matched}.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed'
              });
            }
