name: Auto Close Completed and Wontfix Issues
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issues labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          script: |
            const targetLabels = ['completed', 'wontfix'];
            const issue = context.payload.issue;
            // Handle issues event
            if (issue) {
              const labels = issue.labels.map(l => l.name.toLowerCase());
              if (targetLabels.some(t => labels.includes(t)) && issue.state === 'open') {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed'
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Automatically closed as labeled with ${labels.filter(l => targetLabels.includes(l)).join(', ')}.`
                });
              }
            } else {
              // Scheduled run: list open issues and close matching ones
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: targetLabels.join(','),
                per_page: 100
              });
              for (const iss of issues) {
                if (iss.pull_request) continue;
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: iss.number,
                  state: 'closed',
                  state_reason: 'completed'
                });
              }
            }
