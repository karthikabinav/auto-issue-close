name: Auto Close Completed and Wontfix Issues

on:
  issues:
    types: [opened, labeled, reopened]
  issue_comment:
    types: [created]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check labels and close issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) {
              console.log("No issue found in payload");
              return;
            }
            const labels = issue.labels.map(l => typeof l === "string" ? l : l.name);
            console.log(`Issue #${issue.number} has labels: ${labels.join(", ")}`);
            
            const shouldClose = labels.includes("completed") || labels.includes("wontfix");
            
            if (shouldClose && issue.state === "open") {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "✅ This issue has been automatically closed because it was labeled as `completed` or `wontfix`.

Automated by GitHub Actions workflow."
              });
              console.log(`Closed issue #${issue.number}`);
            } else {
              console.log(`Issue #${issue.number} not closed. Labels: ${labels.join(", ")}`);
            }