name: Automated Issue Closing

on:
  issues:
    types: [labeled, opened, edited]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check for completed or wontfix label
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const label = context.payload.label?.name || "";
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);
            if (labels.includes("completed") || labels.includes("wontfix") || label === "completed" || label === "wontfix") {
              core.setOutput("should_close", "true");
            } else {
              core.setOutput("should_close", "false");
            }
      - name: Close issue if labeled
        if: steps.check.outputs.should_close == "true"
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "🤖 This issue was automatically closed by GitHub Actions because it was labeled as `completed` or `wontfix`."
            });