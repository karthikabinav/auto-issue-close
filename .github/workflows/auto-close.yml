name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled, opened]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  close-labeled-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Close issues with completed or wontfix labels
        uses: actions/github-script@v7
        with:
          script: |
            const targetLabels = ["completed", "wontfix"];
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open"
            });
            for (const issue of issues) {
              const labels = issue.labels.map(l => typeof l === "string" ? l : l.name);
              const hasTargetLabel = labels.some(label => targetLabels.includes(label));
              if (hasTargetLabel) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "closed",
                  state_reason: "completed"
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Automatically closing this issue because it was labeled as "${labels.find(l => targetLabels.includes(l))}".`
                });
                console.log(`Closed issue #${issue.number}: ${issue.title}`);
              }
            }
