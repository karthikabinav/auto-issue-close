name: Auto Close Labeled Issues

on:
  issues:
    types: [opened, labeled]
  schedule:
    - cron: "*/10 * * * *"

permissions:
  issues: write

jobs:
  auto-close:
    runs-on: ubuntu-latest
    steps:
      - name: Close issues labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open"
            });
            for (const issue of issues) {
              if (issue.pull_request) continue;
              const labels = issue.labels.map(l => l.name);
              if (labels.includes("completed") || labels.includes("wontfix")) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: "closed",
                  state_reason: "completed"
                });
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: `Automatically closed because labeled as `${"completed" in labels ? "completed" : "wontfix"}`.`
                });
              }
            }
