name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled, opened]

permissions:
  issues: write

jobs:
  auto-close:
    runs-on: ubuntu-latest
    if: contains(github.event.label.name, 'completed') || contains(github.event.label.name, 'wontfix') || (github.event.issue.labels.*.name && (contains(join(github.event.issue.labels.*.name, ','), 'completed') || contains(join(github.event.issue.labels.*.name, ','), 'wontfix')))
    steps:
      - name: Close issue if labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) {
              console.log('No issue context');
              return;
            }
            const labels = issue.labels.map(l => l.name);
            console.log(`Issue #${issue.number} labels:`, labels);
            if (labels.includes('completed') || labels.includes('wontfix')) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Automatically closing this issue because it was labeled as **${labels.includes('completed') ? 'completed' : 'wontfix'}**.`
              });
              console.log(`Closed issue #${issue.number}`);
            }
