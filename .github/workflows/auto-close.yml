name: Auto Close Labeled Issues
on:
  issues:
    types: [labeled, opened, edited]
jobs:
  auto-close:
    runs-on: ubuntu-latest
    if: contains(toJson(github.event.issue.labels.*.name), "completed") || contains(toJson(github.event.issue.labels.*.name), "wontfix")
    steps:
      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name);
            if (labels.includes("completed") || labels.includes("wontfix")) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: "closed"
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: "Automatically closed by workflow: label is completed or wontfix."
              });
            }
