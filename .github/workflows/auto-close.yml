name: Auto Close Issues
on:
  issues:
    types: [labeled]
jobs:
  close:
    if: contains(github.event.issue.labels.*.name, completed) || contains(github.event.issue.labels.*.name, wontfix)
    runs-on: ubuntu-latest
    steps:
      - name: Close issue
        run: echo "Closing issue labeled completed or wontfix"
