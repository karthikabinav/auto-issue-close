name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled, opened, edited]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issue if labeled completed or wontfix
        if: contains(github.event.issue.labels.*.name, 'completed') || contains(github.event.issue.labels.*.name, 'wontfix')
        run: |
          echo "Closing issue #${{ github.event.issue.number }} with completed/wontfix label"
          gh issue close ${{ github.event.issue.number }} --comment "Automatically closed because label is completed or wontfix."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
