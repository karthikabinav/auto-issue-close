name: Auto Close Issues
on:
  issues:
    types: [labeled, opened]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    steps:
      - name: Close issue if labeled completed or wontfix
        uses: actions/github-script@v6
        with:
          script: |
            const targetLabels = ["completed", "wontfix"];
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);
            if (labels.some(l => targetLabels.includes(l))) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });
              console.log(`Closed issue #${issue.number} with labels: ${labels.join(", ")}`);
            } else {
              console.log(`Issue #${issue.number} does not have target labels, skipping`);
            }
