name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled, opened]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issue if labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const labelName = context.payload.label ? context.payload.label.name : null;
            const labels = issue.labels.map(l => l.name);
            const targetLabels = ['completed', 'wontfix'];
            const shouldClose = labelName ? targetLabels.includes(labelName) : labels.some(l => targetLabels.includes(l));
            if (shouldClose && issue.state === 'open') {
              console.log(`Closing issue #${issue.number} due to label: ${labelName || labels.join(', ')}`);
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Automatically closed because label \`"${labelName || targetLabels.find(l=>labels.includes(l))}\"\`` + ` is in [completed, wontfix].`
              });
            } else {
              console.log(`Issue #${issue.number} does not require auto-close. Labels: ${labels.join(', ')}`);
            }
