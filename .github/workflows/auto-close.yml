name: Auto Close Labeled Issues
on:
  issues:
    types: [labeled, opened, edited, reopened]
jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issues labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) {
              console.log("No issue payload");
              return;
            }
            const labels = issue.labels.map(l => l.name.toLowerCase());
            console.log(`Issue #${issue.number} labels: ${labels.join(", ")}`);
            if (labels.includes("completed") || labels.includes("wontfix")) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed"
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "🤖 This issue was automatically closed by the workflow because it has the `completed` or `wontfix` label."
              });
              console.log(`Closed issue #${issue.number}`);
            } else {
              console.log(`Issue #${issue.number} does not have relevant labels, leaving open`);
            }
