name: Auto Close Labeled Issues

on:
  issues:
    types: [opened, labeled, edited]
  issue_comment:
    types: [created]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    steps:
      - name: Check for completed or wontfix label and close
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            if (!issue) {
              console.log("No issue found in payload");
              return;
            }
            const labels = issue.labels.map(l => typeof l === "string" ? l : l.name);
            console.log("Issue labels:", labels);
            if (labels.includes("completed") || labels.includes("wontfix")) {
              if (issue.state === "open") {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "closed"
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: "Automatically closed by GitHub Actions: This issue is labeled as completed or wontfix."
                });
                console.log("Closed issue #" + issue.number);
              } else {
                console.log("Issue already closed");
              }
            } else {
              console.log("No matching labels found. Issue remains open.");
            }
