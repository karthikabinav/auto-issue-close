name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled, opened, reopened, edited]

permissions:
  issues: write

jobs:
  auto-close:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.issue.labels.*.name, 'completed') ||
      contains(github.event.issue.labels.*.name, 'wontfix')
    steps:
      - name: Close labeled issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              state: 'closed'
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: '🤖 This issue was automatically closed because it was labeled as "completed" or "wontfix".'
            });
