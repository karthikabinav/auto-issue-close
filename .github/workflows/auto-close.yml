name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled]

jobs:
  close-issue:
    runs-on: ubuntu-latest
    if: contains(github.event.label.name, 'completed') || contains(github.event.label.name, 'wontfix')
    permissions:
      issues: write
    steps:
      - name: Close Issue
        uses: peter-evans/close-issue@v2
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: "Automatically closing this issue because it was labeled as '${{ github.event.label.name }}'."
