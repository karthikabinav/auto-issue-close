name: Auto Close Labeled Issues

on:
  issues:
    types: [opened, labeled]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, completed) || contains(github.event.issue.labels.*.name, wontfix)
    permissions:
      issues: write
    steps:
      - name: Close issue with completed or wontfix label
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);
            console.log(`Closing issue #${issue.number} with labels: ${labels.join(", ")}`);
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: "closed",
              state_reason: "completed"
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `Automatically closed because it was labeled as \`${labels.find(l => ["completed","wontfix"].includes(l))}\`.`
            });
