name: Auto Close Labeled Issues

on:
  issues:
    types: [opened, labeled]
  schedule:
    - cron: "0 * * * *"  # Run hourly
  workflow_dispatch:

permissions:
  issues: write

jobs:
  auto-close:
    runs-on: ubuntu-latest
    steps:
      - name: Auto close completed or wontfix issues
        uses: actions/github-script@v7
        with:
          script: |
            const labelsToClose = ["completed", "wontfix"];
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open"
            });
            for (const issue of issues.data) {
              const issueLabels = issue.labels.map(l => l.name);
              const shouldClose = issueLabels.some(l => labelsToClose.includes(l));
              if (shouldClose) {
                console.log(`Closing issue #${issue.number}: ${issue.title}`);
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Automatically closing this issue because it is labeled as \`${issueLabels.filter(l => labelsToClose.includes(l)).join(", ")}\`.`
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "closed"
                });
              }
            }
