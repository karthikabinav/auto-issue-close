name: Auto Close Labeled Issues
on:
  workflow_dispatch:
  issues:
    types: [labeled]

# SAFETY NOTE: This workflow is intentionally configured to require manual review
# before closing issues. Auto-closing issues can lead to loss of important tracking
# and should be reviewed by a maintainer.
# To enable auto-close, add explicit approval step and restrict to trusted labels.

jobs:
  check-label:
    runs-on: ubuntu-latest
    steps:
      - name: Log labeled event
        run: |
          echo "Issue #${{ github.event.issue.number }} labeled with ${{ github.event.label.name }}"
          echo "Manual review required before closing."
          echo "Labels that would trigger close in unsafe version: completed, wontfix"
          echo "No automatic close performed - requires maintainer approval."
