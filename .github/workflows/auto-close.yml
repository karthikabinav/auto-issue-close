name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled, opened, edited]
  pull_request:
    types: [labeled]

jobs:
  close-issue:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'completed' || github.event.label.name == 'wontfix'
    steps:
      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            await github.rest.issues.update({
              owner,
              repo,
              issue_number,
              state: 'closed',
              state_reason: 'completed'
            });
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `Automatically closed issue labeled as ` + context.payload.label.name + ` by automation script.`
            });
