name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled, opened, reopened]
  workflow_dispatch:

jobs:
  close-completed-or-wontfix:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    if: contains(github.event.issue.labels.*.name, 'completed') || contains(github.event.issue.labels.*.name, 'wontfix')
    steps:
      - name: Close issue automatically
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: 'Automatically closing this issue because it was labeled as completed or wontfix.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              state: 'closed',
              state_reason: 'completed'
            });
