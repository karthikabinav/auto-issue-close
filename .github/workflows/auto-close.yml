name: Auto Close Labeled Issues
on:
  issues:
    types: [labeled]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  auto-close:
    runs-on: ubuntu-latest
    steps:
      - name: Close issues labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          script: |
            const labelsToClose = ["completed", "wontfix"];
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open"
            });
            for (const issue of issues.data) {
              if (issue.pull_request) continue;
              const labels = issue.labels.map(l => l.name);
              if (labels.some(l => labelsToClose.includes(l))) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "closed"
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Automatically closed as labeled \`${labels.find(l => labelsToClose.includes(l))}\`.`
                });
              }
            }
