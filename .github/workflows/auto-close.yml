name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled]

jobs:
  auto-close:
    if: contains(github.event.label.name, 'completed') || contains(github.event.label.name, 'wontfix')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issue if labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name);
            if (labels.includes('completed') || labels.includes('wontfix')) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `Automatically closing this issue because it was labeled as **${context.payload.label.name}**.`
              });
            }
