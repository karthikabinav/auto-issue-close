name: Auto Close Labeled Issues
on:
  issues:
    types: [labeled, opened, reopened]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issues labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          script: |
            const targetLabels = ["completed", "wontfix"];
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            for (const issue of issues) {
              if (issue.pull_request) continue;
              const labels = issue.labels.map(l => typeof l === "string" ? l : l.name);
              if (labels.some(l => targetLabels.includes(l))) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "closed",
                  state_reason: "completed"
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Automatically closed because it was labeled as ${labels.find(l => targetLabels.includes(l))}.`
                });
                console.log(`Closed #${issue.number}`);
              }
            }
            // Also handle the triggering issue directly for labeled event
            if (context.payload.issue) {
              const issue = context.payload.issue;
              const labels = issue.labels.map(l => l.name || l);
              if (issue.state === "open" && labels.some(l => targetLabels.includes(l))) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "closed",
                  state_reason: "completed"
                });
              }
            }
