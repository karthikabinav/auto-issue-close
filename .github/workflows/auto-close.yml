name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled, opened, reopened]

jobs:
  close-issue:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'completed') || contains(github.event.issue.labels.*.name, 'wontfix')
    permissions:
      issues: write
    steps:
      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;
            const labels = context.payload.issue.labels.map(l => l.name);
            if (labels.includes('completed') || labels.includes('wontfix')) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                state: 'closed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                body: 'Automatically closed by workflow because issue is labeled as completed or wontfix.'
              });
            }
