name: Auto Close Issues

on:
  issues:
    types: [labeled]

jobs:
  auto-close:
    if: contains(github.event.label.name, 'completed') || contains(github.event.label.name, 'wontfix')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issue when labeled completed or wontfix
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            })
            console.log(`Closed issue #${context.issue.number} with label ${context.payload.label.name}`)
