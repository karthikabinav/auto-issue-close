name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled]

jobs:
  auto-close:
    if: contains(github.event.label.name, 'completed') || contains(github.event.label.name, 'wontfix')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'This issue was automatically closed because it was labeled as completed or wontfix.'
            });
