name: Automated Issue Closing

on:
  issues:
    types: [labeled]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    if: contains(github.event.label.name, 'completed') || contains(github.event.label.name, 'wontfix')
    steps:
      - name: Close issue if labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          script: |
            const label = context.payload.label.name;
            const allowed = ['completed', 'wontfix'];
            if (allowed.includes(label)) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `Automatically closing issue because it was labeled as **${label}**.`
              });
            }
