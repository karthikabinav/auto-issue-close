name: Auto Close Completed and Wontfix
on:
  issues:
    types: [labeled]
  workflow_dispatch:
permissions:
  issues: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close completed or wontfix issues
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) return;
            const labels = (issue.labels || []).map(l => l.name);
            if (labels.includes("completed") || labels.includes("wontfix")) {
              await github.rest.issues.update({...context.repo, issue_number: issue.number, state: "closed"});
              await github.rest.issues.createComment({...context.repo, issue_number: issue.number, body: "Automatically closed due to label: " + labels.join(", ")});
            }
