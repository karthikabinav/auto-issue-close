name: Auto Close Issues

on:
  issues:
    types: [labeled, opened, edited]
  
jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issues with completed or wontfix labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);
            if (labels.includes("completed") || labels.includes("wontfix")) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: labels.includes("completed") ? "completed" : "not_planned"
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Automatically closing this issue because it was labeled as "${labels.includes("completed") ? "completed" : "wontfix"}".`
              });
            }
