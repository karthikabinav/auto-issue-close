name: Auto Close Labeled Issues
on:
  issues:
    types: [labeled]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close completed/wontfix issues
        uses: actions/github-script@v7
        with:
          script: |
            const labelsToClose = ["completed", "wontfix"];
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // If triggered by labeling, check that issue
            if (context.payload.issue) {
              const issue = context.payload.issue;
              const hasLabel = issue.labels.some(l => labelsToClose.includes(l.name));
              if (hasLabel && issue.state === "open") {
                await github.rest.issues.update({owner, repo, issue_number: issue.number, state: "closed"});
                await github.rest.issues.createComment({owner, repo, issue_number: issue.number, body: `Automatically closed as labeled \`${issue.labels.map(l=>l.name).join(", ")}\`.`});
              }
            } else {
              // Scheduled: close all open issues with those labels
              for (const label of labelsToClose) {
                const issues = await github.rest.issues.listForRepo({owner, repo, state: "open", labels: label});
                for (const issue of issues.data) {
                  if (!issue.pull_request) {
                    await github.rest.issues.update({owner, repo, issue_number: issue.number, state: "closed"});
                    await github.rest.issues.createComment({owner, repo, issue_number: issue.number, body: `Automatically closed as labeled \`${label}\`.`});
                  }
                }
              }
            }
