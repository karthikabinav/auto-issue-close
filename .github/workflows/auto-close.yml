name: Auto Close Completed or Wontfix Issues

on:
  issues:
    types: [opened, labeled, edited, reopened]
  pull_request:
    types: [opened, labeled]

jobs:
  close_issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Check and close issue
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labelsToClose = ["completed", "wontfix"];
            const item = context.payload.issue || context.payload.pull_request;
            
            if (!item) {
              console.log("No issue or PR found in payload");
              return;
            }
            
            const labels = (item.labels || []).map(label => typeof label === "string" ? label.toLowerCase() : label.name.toLowerCase());
            const hasMatchingLabel = labels.some(label => labelsToClose.includes(label));
            
            console.log(`Issue #${item.number} labels:`, labels);
            console.log(`Has matching label (completed/wontfix):`, hasMatchingLabel);
            
            if (hasMatchingLabel && item.state === "open") {
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: item.number,
                  state: "closed",
                  state_reason: "completed"
                });
                console.log(`Successfully closed issue #${item.number}`);
              } catch (error) {
                console.error(`Failed to close issue #${item.number}:`, error);
              }
            } else {
              console.log(`Issue #${item.number} will remain open`);
            }
