name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issue if labeled completed or wontfix
        if: contains(fromJSON("[\"completed\", \"wontfix\"]"), github.event.label.name)
        uses: actions/github-script@v7
        with:
          script: |
            const label = context.payload.label.name;
            const stateReason = label === "wontfix" ? "not_planned" : "completed";
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
              state_reason: stateReason
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `This issue was automatically closed because it was labeled as "${label}".`
            });
