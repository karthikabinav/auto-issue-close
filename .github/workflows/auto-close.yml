name: Auto Close Issues

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  auto-close:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'completed') || contains(github.event.issue.labels.*.name, 'wontfix')
    steps:
      - name: Close labeled issue
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name);
            if (labels.includes('completed') || labels.includes('wontfix')) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                state: 'closed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: 'Auto-closing issue due to label: ' + labels.join(' ,')
              });
            }
