name: Auto Close Issues

on:
  issues:
    types: [labeled, opened]
  workflow_dispatch:

jobs:
  close-completed-or-wontfix:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check labels and close issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(label => label.name);
            
            if (labels.includes("completed") || labels.includes("wontfix")) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "🤖 This issue has been automatically closed because it was labeled as `" + (labels.includes("completed") ? "completed" : "wontfix") + "`."
              });
            }