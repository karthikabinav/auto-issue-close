name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled]

jobs:
  close-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    if: contains(fromJSON(["completed", "wontfix"]), github.event.label.name)
    steps:
      - name: Close issue when labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const label = context.payload.label.name.toLowerCase();
            const issue_number = context.issue.number;
            const labelsToClose = ["completed", "wontfix"];
            if (!labelsToClose.includes(label)) {
              console.log(`Label ${label} is not in close list, skipping`);
              return;
            }
            console.log(`Closing issue #${issue_number} because it was labeled as ${label}`);
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              state: "closed"
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: `✅ This issue was automatically closed because it was labeled as **${label}**.\n\nIf this was closed in error, please remove the label and reopen the issue.`
            });
