name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled, opened, edited]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'completed') || contains(github.event.issue.labels.*.name, 'wontfix')
    permissions:
      issues: write
    steps:
      - name: Close issue and comment
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);
            let reason = '';
            if (labels.includes('completed')) {
              reason = 'completed';
            } else if (labels.includes('wontfix')) {
              reason = 'wontfix';
            }
            if (reason) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `This issue has been automatically closed because it was labeled as **${reason}**.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
