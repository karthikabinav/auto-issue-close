name: Auto Close Labeled Issues
on:
  issues:
    types: [labeled]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Auto close issues with completed or wontfix labels
        uses: actions/github-script@v7
        with:
          script: |
            const labelsToClose = ["completed", "wontfix"];
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            for (const issue of issues.data) {
              const labelNames = issue.labels.map(l => l.name);
              if (labelNames.some(l => labelsToClose.includes(l))) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "closed"
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Automatically closing issue labeled as ${labelNames.find(l => labelsToClose.includes(l))}.`
                });
            }
          }
