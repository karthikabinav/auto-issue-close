name: Auto Close Issues
on:
  issues:
    types: [labeled]

jobs:
  close_labeled_issues:
    if: github.event.label.name == completed || github.event.label.name == wontfix
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issue when labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: closed,
              state_reason: completed
            })
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: Automatically closed because label `" + context.payload.label.name + "` was applied.
            })
