name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled, opened, edited]
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

jobs:
  auto-close-completed-or-wontfix:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'completed') || contains(github.event.issue.labels.*.name, 'wontfix')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Close issue automatically
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            if (!issue) {
              console.log('No issue in context');
              return;
            }
            const labels = issue.labels.map(l => l.name);
            let reason = 'completed';
            let comment = 'This issue has been automatically closed because it was labeled as completed or wontfix.';
            if (labels.includes('wontfix')) {
              reason = 'not_planned';
              comment = 'This issue has been automatically closed because it was labeled as wontfix.';
            }
            if (labels.includes('completed')) {
              reason = 'completed';
              comment = 'This issue has been automatically closed because it was labeled as completed.';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: comment
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
              state_reason: reason
            });
            console.log(`Closed issue #${issue.number} with labels: ${labels.join(', ')}`);
