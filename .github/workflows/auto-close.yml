name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled, opened, edited]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    if: contains('completed,wontfix', github.event.label.name)
    permissions:
      issues: write
    steps:
      - name: Close issue if labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          script: |
            const label = context.payload.label?.name || '';
            if (label === 'completed' || label === 'wontfix') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `🤖 Automatically closed this issue because it was labeled as '${label}'.`
              });
            }
