name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    if: contains(github.event.label.name, 'completed') || contains(github.event.label.name, 'wontfix')
    permissions:
      issues: write
    steps:
      - name: Close issue with completed/wontfix label
        run: |
          echo "Closing issue #${{ github.event.issue.number }} labeled as ${{ github.event.label.name }}"
          gh issue close ${{ github.event.issue.number }} --reason completed --comment "Automatically closing issue labeled as ${{ github.event.label.name }}."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
