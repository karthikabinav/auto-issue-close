name: Auto Close Issues

on:
  issues:
    types: [labeled]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'completed' || github.event.label.name == 'wontfix'
    permissions:
      issues: write
    steps:
      - name: Close issue with completed or wontfix label
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            console.log(`Closing issue #${issue_number} labeled as ${context.payload.label.name}`);
            await github.rest.issues.update({
              owner,
              repo,
              issue_number,
              state: 'closed',
              state_reason: 'completed'
            });
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `Automatically closing this issue because it was labeled as **${context.payload.label.name}**.`
            });
