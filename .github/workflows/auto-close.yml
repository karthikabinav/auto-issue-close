name: Auto Close Labeled Issues

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  auto-close:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-close issues labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name);
            const targetLabels = ['completed', 'wontfix'];
            const matched = labels.find(l => targetLabels.includes(l));
            if (matched) {
              console.log(`Issue #${context.issue.number} has label '${matched}', closing...`);
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `🤖 Automatically closing this issue because it was labeled as **${matched}**.`
              });
            } else {
              console.log(`Issue #${context.issue.number} does not have target labels. Labels: ${labels.join(', ')}`);
            }
