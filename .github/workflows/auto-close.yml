name: Auto Close Labeled Issues
on:
  issues:
    types: [opened, labeled, reopened, edited]
  pull_request:
    types: [opened]
jobs:
  close-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Check for completed or wontfix label and close
        if: contains(github.event.issue.labels.*.name, 'completed') || contains(github.event.issue.labels.*.name, 'wontfix')
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labels = context.payload.issue.labels.map(l => l.name);
            if (labels.includes('completed') || labels.includes('wontfix')) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: 'This issue has been automatically closed because it is labeled as completed or wontfix.'
              });
            }