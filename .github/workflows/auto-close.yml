name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled, opened, edited, reopened]
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  close-labeled-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Close issues with completed or wontfix labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labelsToClose = ["completed", "wontfix"];
            
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            
            console.log(`Found ${issues.length} open issues`);
            
            for (const issue of issues) {
              if (issue.pull_request) continue;
              
              const issueLabels = issue.labels.map(label => 
                typeof label === "string" ? label : label.name
              );
              
              const shouldClose = issueLabels.some(label => 
                labelsToClose.includes(label.toLowerCase())
              );
              
              if (shouldClose) {
                console.log(`Closing issue #${issue.number}: ${issue.title}`);
                
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "closed"
                });
                
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: "✅ This issue was automatically closed by the automation workflow because it was labeled as **completed** or **wontfix**.
                  
                  If this was closed in error, please remove the label and reopen the issue."
                });
              }
            }
            
            console.log("Automation script completed successfully.");