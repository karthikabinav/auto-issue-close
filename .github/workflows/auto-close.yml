name: Auto Close Issues

on:
  issues:
    types: [labeled, opened, edited]
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  close_issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Close labeled issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labelsToClose = ["completed", "wontfix"];
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            for (const issue of issues) {
              if (issue.pull_request) continue;
              const issueLabels = issue.labels.map(l => typeof l === "string" ? l : l.name);
              const matchedLabel = issueLabels.find(l => labelsToClose.includes(l));
              if (matchedLabel) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "closed",
                  state_reason: "completed"
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `🤖 Automatically closed: This issue is labeled as ${matchedLabel}.`
                });
                console.log(`Closed issue #${issue.number}: ${issue.title}`);
              }
            }
