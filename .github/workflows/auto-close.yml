name: Auto Close Issues

on:
  issues:
    types: [labeled, opened, reopened]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issues labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          script: |
            const labelsToClose = ['completed', 'wontfix'];
            const issueLabels = context.payload.issue.labels.map(l => l.name);
            if (issueLabels.some(label => labelsToClose.includes(label))) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: 'Automatically closing this issue due to label: ' + issueLabels.join(', ')
              });
            }
