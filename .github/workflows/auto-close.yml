name: Automated Issue Closing

on:
  issues:
    types: [labeled, opened]

permissions:
  issues: write

jobs:
  auto-close:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'completed') || contains(github.event.issue.labels.*.name, 'wontfix')
    steps:
      - name: Close issue if labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Automatically closing this issue as it was labeled as completed or wontfix.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
