name: Automated Issue Closing

on:
  issues:
    types: [labeled, opened]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check labels and close if completed or wontfix
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name);
            const target = ['completed', 'wontfix'];
            const matched = labels.find(l => target.includes(l));
            if (matched) {
              console.log(`Found target label: ${matched}, closing issue #${context.payload.issue.number}`);
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `✅ Automatically closed because label is: **${matched}**.`
              });
            } else {
              console.log(`No target label found. Labels: ${labels.join(', ')}. Issue remains open.`);
            }
