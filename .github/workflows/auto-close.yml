name: Auto Close Labeled Issues
on:
  issues:
    types: [labeled, opened]
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Auto close completed or wontfix issues
        uses: actions/github-script@v7
        with:
          script: |
            const targetLabels = ['completed', 'wontfix'];
            const issue = context.payload.issue;
            // If triggered by single issue event
            if (issue && issue.state === 'open') {
              const labels = issue.labels.map(l => l.name.toLowerCase());
              if (labels.some(l => targetLabels.includes(l))) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Auto-closed because label is ${labels.find(l => targetLabels.includes(l))}.`
                });
              }
            } else {
              // Scheduled / manual: scan all open issues
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100
              });
              for (const iss of issues) {
                if (iss.pull_request) continue;
                const labels = iss.labels.map(l => l.name.toLowerCase());
                if (labels.some(l => targetLabels.includes(l))) {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: iss.number,
                    state: 'closed'
                  });
                }
              }
            }
