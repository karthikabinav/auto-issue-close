name: Auto Close Labeled Issues

on:
  issues:
    types: [opened, labeled, reopened, edited]

jobs:
  close-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close completed or wontfix issues
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) {
              console.log("No issue found");
              return;
            }
            const labels = issue.labels.map(label => label.name);
            console.log(`Issue #${issue.number} labels: ${labels.join(", ")}`);
            
            if (labels.includes("completed") || labels.includes("wontfix")) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "✅ Automatically closed: This issue has been labeled as `completed` or `wontfix`."
              });
              
              console.log(`Closed issue #${issue.number}`);
            } else {
              console.log("No matching labels, skipping");
            }
