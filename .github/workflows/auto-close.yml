name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled]
  pull_request_target:
    types: [labeled]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    if: contains(completed,wontfix, github.event.label.name)
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Close issue if labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const label = context.payload.label.name;
            const issue_number = context.payload.issue?.number || context.payload.pull_request?.number;
            if (!issue_number) {
              console.log("No issue number found");
              return;
            }
            if (label === completed || label === wontfix) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                state: closed
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                body: `Automatically closed this issue because it was labeled .`
              });
              console.log(`Closed issue #${issue_number} labeled ${label}`);
            }
