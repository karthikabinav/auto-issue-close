name: Auto Close Labeled Issues
on:
  issues:
    types: [labeled, opened, edited, reopened]
jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issues labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) {
              console.log("No issue payload");
              return;
            }
            const labels = issue.labels.map(l => l.name.toLowerCase());
            if (labels.includes('completed') || labels.includes('wontfix')) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '🤖 This issue was automatically closed because it was labeled as completed or wontfix.'
              });
              console.log(`Closed issue #${issue.number}`);
            } else {
              console.log(`Issue #${issue.number} does not have relevant labels`);
            }
