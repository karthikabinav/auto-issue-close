name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled, opened, edited, reopened]

permissions:
  issues: write

jobs:
  auto-close:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'completed') || contains(github.event.issue.labels.*.name, 'wontfix')
    steps:
      - name: Auto close issue labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            if (!issue) return;
            const labels = issue.labels.map(l => l.name);
            const closeLabels = ["completed", "wontfix"];
            const matched = labels.find(l => closeLabels.includes(l));
            if (matched && issue.state === 'open') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: matched === 'wontfix' ? 'not_planned' : 'completed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Automatically closing this issue because it was labeled as ${matched}.`
              });
              console.log(`Closed issue #${issue.number} with label ${matched}`);
            }
