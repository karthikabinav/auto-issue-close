name: Automated Issue Closing

on:
  issues:
    types: [labeled]

jobs:
  close-labeled-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    if: contains(github.event.label.name, 'completed') || contains(github.event.label.name, 'wontfix')
    steps:
      - name: Close issue with completed or wontfix label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            })
