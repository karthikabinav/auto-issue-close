name: Auto Close Labeled Issues

on:
  issues:
    types: [opened, labeled, edited]
  pull_request:
    types: [labeled]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check labels and close issue
        uses: actions/github-script@v7
        with:
          script: |
            const closeLabels = ["completed", "wontfix"];
            const issue = context.payload.issue || context.payload.pull_request;
            const issueNumber = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Get issue details to check labels
            const { data: issueData } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber
            });
            
            const labels = issueData.labels.map(l => l.name);
            const shouldClose = labels.some(label => closeLabels.includes(label));
            
            if (shouldClose && issueData.state === "open") {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issueNumber,
                state: "closed"
              });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `Automatically closed issue labeled as ${labels.filter(l => closeLabels.includes(l)).join(", ")} by automation script.`
              });
              console.log(`Closed issue #${issueNumber} with labels: ${labels.join(", ")}`);
            } else {
              console.log(`Issue #${issueNumber} not eligible for auto-close. Labels: ${labels.join(", ")}`);
            }
