name: Auto Close Labeled Issues
on:
  issues:
    types: [labeled, opened, edited, reopened]
  pull_request:
    types: [labeled]
jobs:
  auto-close:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, completed) || contains(github.event.issue.labels.*.name, wontfix)
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Close completed or wontfix issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            if (!issue) {
              console.log("No issue payload");
              return;
            }
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: "closed",
              state_reason: "completed"
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: "🤖 This issue was automatically closed by the workflow because it has the `completed` or `wontfix` label."
            });
            console.log(`Closed issue #${issue.number} with labels: ${issue.labels.map(l => l.name).join(", ")}`);
