name: Auto Close Completed and Wontfix Issues
on:
  issues:
    types: [labeled, opened]
  workflow_dispatch:
permissions:
  issues: write
jobs:
  auto-close:
    runs-on: ubuntu-latest
    steps:
      - name: Close issue if labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name);
            const closeLabels = ["completed", "wontfix"];
            if (labels.some(l => closeLabels.includes(l))) {
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number, state: "closed"});
            }
