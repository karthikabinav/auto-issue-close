name: Automated Issue Closing

on:
  issues:
    types:
      - labeled
      - opened

permissions:
  issues: write

jobs:
  auto-close:
    runs-on: ubuntu-latest
    steps:
      - name: Check labels and close
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) {
              console.log("No issue payload");
              return;
            }
            const labels = issue.labels.map(l => typeof l === "string" ? l : l.name);
            const shouldClose = labels.includes("completed") || labels.includes("wontfix");
            if (shouldClose) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: labels.includes("wontfix") ? "not_planned" : "completed"
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "✅ Automatically closed this issue because it was labeled as `completed` or `wontfix`."
              });
              console.log(`Closed issue #${issue.number}`);
            } else {
              console.log("Issue does not have target labels, skipping.");
            }
