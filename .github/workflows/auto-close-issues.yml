name: Auto Close Issues

on:
  issues:
    types: [opened, labeled, reopened]

permissions:
  issues: write

jobs:
  auto-close:
    if: contains(github.event.issue.labels.*.name, "completed") || contains(github.event.issue.labels.*.name, "wontfix")
    runs-on: ubuntu-latest
    steps:
      - name: Close completed or wontfix issue
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map((label) => label.name);
            const stateReason = labels.includes("completed") ? "completed" : "not_planned";
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
              state_reason: stateReason
            });
