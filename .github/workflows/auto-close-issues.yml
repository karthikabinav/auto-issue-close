name: Auto-close labeled issues

on:
  issues:
    types: [opened, labeled, reopened]

permissions:
  issues: write

jobs:
  close-labeled-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Close issues labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          script: |
            const labelsToClose = ["completed", "wontfix"];
            const issue = context.payload.issue;
            if (!issue) return;
            const labels = issue.labels.map(l => l.name.toLowerCase());
            if (labels.some(l => labelsToClose.includes(l)) && issue.state === "open") {
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: "closed"});
            }
