name: Auto Close Labeled Issues

on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:

jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issues labeled completed or wontfix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          for label in completed wontfix; do
            echo "Checking issues labeled: $label"
            gh issue list --repo "$GH_REPO" --state open --label "$label" --json number --jq .[].number | while read -r issue_number; do
              echo "Auto-closing issue #$issue_number (labeled: $label)"
              gh issue close "$issue_number" --repo "$GH_REPO" --comment "Automatically closed because the issue is labeled as \"$label\"."
            done
          done
