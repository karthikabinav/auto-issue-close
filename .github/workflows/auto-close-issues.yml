name: Auto Close Issues
on:
  issues:
    types: [labeled, opened, reopened]
jobs:
  close:
    if: contains(github.event.issue.labels.*.name, "completed") || contains(github.event.issue.labels.*.name, "wontfix")
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: "closed"});
