name: Auto Close Issues

on:
  issues:
    types: [labeled, opened, reopened, edited]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Close labeled issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            if (!issue) return;
            const labels = issue.labels.map(label => label.name);
            const closeLabels = ["completed", "wontfix"];
            const shouldClose = labels.some(label => closeLabels.includes(label));
            if (shouldClose && issue.state === "open") {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });
              const matchedLabel = labels.find(label => closeLabels.includes(label));
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `This issue was automatically closed because it was labeled as ${matchedLabel}.`
              });
              console.log(`Closed issue #${issue.number}`);
            }
