name: Auto Close Labeled Issues

on:
  issues:
    types: [opened, labeled, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to check (only completed or wontfix issues are closed)
        required: true
        type: string

permissions:
  issues: write

concurrency:
  group: auto-close-issue-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  auto-close:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'completed') || contains(github.event.issue.labels.*.name, 'wontfix')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close matching issue safely
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            // Read event data as data, never interpolate issue content into code.
            const issue_number = Number(context.eventName === 'workflow_dispatch'
              ? context.payload.inputs.issue_number
              : context.issue.number);
            if (!Number.isSafeInteger(issue_number) || issue_number < 1) {
              throw new Error('A positive integer issue number is required.');
            }

            // Check current labels in case they changed while this run was queued.
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
            if (issue.pull_request || issue.state !== 'open') {
              core.info(`Skipping #${issue_number}: not an open issue.`);
              return;
            }
            const labels = new Set(issue.labels.map(label =>
              typeof label === 'string' ? label : label.name
            ));
            if (!labels.has('completed') && !labels.has('wontfix')) {
              core.info(`Leaving #${issue_number} open: no completed or wontfix label.`);
              return;
            }

            await github.rest.issues.update({
              owner, repo, issue_number,
              state: 'closed',
              state_reason: labels.has('completed') ? 'completed' : 'not_planned'
            });
            core.info(`Closed issue #${issue_number}.`);
