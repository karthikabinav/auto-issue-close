name: Auto-close labeled issues

on:
  issues:
    types: [opened, labeled, reopened]
  workflow_dispatch:
    inputs:
      issue_numbers:
        description: Comma-separated issue numbers to check (no repository-wide sweep)
        required: true
        type: string

permissions:
  issues: write

concurrency:
  group: auto-issue-close-${{ github.repository }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  close-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close only issues labeled completed or wontfix
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          ISSUE_NUMBERS: ${{ inputs.issue_numbers }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            let numbers;
            if (context.eventName === "workflow_dispatch") {
              const input = (process.env.ISSUE_NUMBERS || "").trim();
              if (!/^[1-9]\d*(\s*,\s*[1-9]\d*)*$/.test(input)) {
                throw new Error("Provide comma-separated positive issue numbers.");
              }
              numbers = [...new Set(input.split(",").map(value => Number(value.trim())))];
              if (numbers.length > 100 || numbers.some(number => !Number.isSafeInteger(number))) {
                throw new Error("Provide at most 100 valid issue numbers.");
              }
            } else {
              numbers = [context.issue.number];
            }

            for (const issue_number of numbers) {
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
              if (issue.pull_request || issue.state !== "open") {
                core.info(`Skipping #${issue_number}: not an open issue.`);
                continue;
              }
              const labels = issue.labels.map(label => typeof label === "string" ? label : label.name);
              const completed = labels.includes("completed");
              if (!completed && !labels.includes("wontfix")) {
                core.info(`Leaving #${issue_number} open: no matching label.`);
                continue;
              }
              await github.rest.issues.update({
                owner, repo, issue_number,
                state: "closed",
                state_reason: completed ? "completed" : "not_planned"
              });
              core.info(`Closed #${issue_number}.`);
            }
