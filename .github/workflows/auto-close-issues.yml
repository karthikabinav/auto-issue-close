name: Auto Close Issues

on:
  issues:
    types: [labeled]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check label and close issue
        uses: actions/github-script@v7
        with:
          script: |
            const label = context.payload.label.name;
            const validLabels = ['completed', 'wontfix'];
            
            if (validLabels.includes(label)) {
              console.log(`Label '${label}' detected. Closing issue #${context.issue.number}...`);
              
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed'
              });
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `🤖 Automatically closing this issue because it was labeled as '${label}'.`
              });
              
              console.log(`Issue #${context.issue.number} closed successfully.`);
            } else {
              console.log(`Label '${label}' does not trigger auto-close. Skipping.`);
            }