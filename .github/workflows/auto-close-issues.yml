name: Auto Close Issues
on:
  issues:
    types: [labeled]
  schedule:
    - cron: "0 * * * *"
jobs:
  close-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Close completed or wontfix issues
        uses: actions/github-script@v7
        with:
          script: |
            const labelsToClose = ['completed', 'wontfix'];
            const issues = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open'});
            for (const issue of issues.data) {
              const labels = issue.labels.map(l => l.name);
              if (labels.some(l => labelsToClose.includes(l))) {
                await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed'});
              }
            }
