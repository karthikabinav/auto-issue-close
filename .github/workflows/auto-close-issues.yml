name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    if: contains('completed wontfix', github.event.label.name)
    steps:
      - name: Close issue with completed or wontfix label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const label = context.payload.label.name;
            const issueNumber = context.issue.number;
            
            // Only close issues with 'completed' or 'wontfix' labels
            if (label === 'completed' || label === 'wontfix') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed',
                state_reason: label
              });
            }
