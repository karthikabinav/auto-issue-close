name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled]

jobs:
  close-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Close issue if labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const label = context.payload.label;

            const autoCloseLabels = ["completed", "wontfix"];

            if (autoCloseLabels.includes(label.name)) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `This issue was automatically closed because it was labeled as **${label.name}**.`
              });

              console.log(`Issue #${issue.number} closed due to label: ${label.name}`);
            } else {
              console.log(`Label "${label.name}" does not trigger auto-close. Skipping.`);
            }
