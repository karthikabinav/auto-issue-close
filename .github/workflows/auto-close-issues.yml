name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled, opened]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Auto-close issue if label is completed or wontfix
        if: contains(github.event.label.name, 'completed') || contains(github.event.label.name, 'wontfix')
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const label = context.payload.label?.name;
            if (label === 'completed' || label === 'wontfix') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Automatically closing this issue because it was labeled as \`${label}\`.`
              });
            }
