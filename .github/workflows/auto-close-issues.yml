name: Auto-close labeled issues

on:
  issues:
    types: [opened, labeled, reopened]
  schedule:
    - cron: "0 * * * *"

permissions:
  issues: write

jobs:
  close-labeled-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Close issues labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          script: |
            const labelsToClose = ["completed", "wontfix"];
            const issue = context.payload.issue;
            // If triggered by issue event, check single issue
            if (issue) {
              const issueLabels = issue.labels.map(l => l.name.toLowerCase());
              const shouldClose = labelsToClose.some(l => issueLabels.includes(l.toLowerCase()));
              if (shouldClose && issue.state === "open") {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "closed"
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: "Auto-closed due to matching label (completed/wontfix)."
                });
              }
            } else {
              // Scheduled run: scan all open issues
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                per_page: 100
              });
              for (const item of issues) {
                if (item.pull_request) continue;
                const itemLabels = item.labels.map(l => l.name.toLowerCase());
                const shouldClose = labelsToClose.some(l => itemLabels.includes(l.toLowerCase()));
                if (shouldClose) {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: item.number,
                    state: "closed"
                  });
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: item.number,
                    body: "Auto-closed due to matching label (completed/wontfix)."
                  });
                }
              }
            }
