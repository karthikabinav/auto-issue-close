name: Auto-close completed and wontfix issues

on:
  issues:
    types: [labeled, opened, reopened, edited]

jobs:
  auto-close:
    if: contains(join(github.event.issue.labels.*.name, ","), "completed") || contains(join(github.event.issue.labels.*.name, ","), "wontfix")
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issue labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.addComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: "This issue is being automatically closed because it is labeled completed or wontfix."});
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: "closed"});
