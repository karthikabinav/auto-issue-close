name: Auto Close Issues

on:
  issues:
    types: [labeled, opened]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, completed) || contains(github.event.issue.labels.*.name, wontfix)
    steps:
      - name: Close Issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.issue;
            const labels = context.payload.issue.labels.map(label => label.name);
            
            if (labels.includes(completed) || labels.includes(wontfix)) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: closed
              });
              
              const label = labels.includes(completed) ? completed : wontfix;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `This issue has been automatically closed because it was labeled as ${label}.`
              });
              
              console.log(`Closed issue #${issue.number} with label: ${label}`);
            }
