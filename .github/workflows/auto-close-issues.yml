name: Auto Close Issues

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  close-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Close issue if labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const labelName = context.payload.label?.name;

            if (!labelName || (labelName !== 'completed' && labelName !== 'wontfix') || issue.state === 'closed') {
              console.log('Issue does not need to be closed.');
              return;
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed'
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `This issue has been automatically closed because it was labeled as **${labelName}**.`
            });

            console.log(`Issue #${issue.number} closed due to label: ${labelName}`);
