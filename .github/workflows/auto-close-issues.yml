name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled]

jobs:
  close-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Close issue if labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const labelName = context.payload.label.name;
            if (labelName === "completed" || labelName === "wontfix") {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `This issue was automatically closed because it was labeled as **${labelName}**.`
              });
              console.log(`Issue #${issue.number} closed due to label: ${labelName}`);
            } else {
              console.log(`Label ${labelName} does not trigger auto-close.`);
            }
