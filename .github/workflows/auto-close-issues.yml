name: Auto Close Labeled Issues
on:
  issues:
    types: [opened, labeled]
permissions:
  issues: write
jobs:
  auto-close:
    runs-on: ubuntu-latest
    steps:
      - name: Close if labeled completed or wontfix
        if: contains(github.event.issue.labels.*.name, completed) || contains(github.event.issue.labels.*.name, wontfix)
        run: |
          echo "Closing issue #${{ github.event.issue.number }} due to label"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/github-script@v7
        if: contains(github.event.issue.labels.*.name, completed) || contains(github.event.issue.labels.*.name, wontfix)
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: closed
            });
