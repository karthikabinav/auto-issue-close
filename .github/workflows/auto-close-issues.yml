name: Auto Close Issues

on:
  issues:
    types: [labeled, opened]

jobs:
  auto-close:
    runs-on: ubuntu-latest
    steps:
      - name: Close issues with completed or wontfix labels
        uses: actions/github-script@v6
        with:
          script: |
            const issue = context.payload.issue;
            const targetLabels = ["completed", "wontfix"];
            const issueLabels = issue.labels.map(label => label.name);
            
            // Check if issue has any of the target labels
            const hasTargetLabel = targetLabels.some(label => issueLabels.includes(label));
            
            if (hasTargetLabel && issue.state === "open") {
              console.log(`Closing issue #${issue.number} with labels: ${issueLabels.join(", ")}`);
              
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "This issue was automatically closed because it has a label indicating it is either completed or will not be fixed."
              });
            } else {
              console.log(`Issue #${issue.number} does not have auto-close labels, skipping.`);
            }