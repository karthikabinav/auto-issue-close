name: Auto Close Labeled Issues

on:
  issues:
    types: [labeled, opened]
  issue_comment:
    types: [created]

jobs:
  close-completed-or-wontfix:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Auto-close labeled issues
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labelsToClose = ["completed", "wontfix"];
            const issue = context.payload.issue;
            if (!issue) return;
            const hasMatchingLabel = issue.labels.some(label => labelsToClose.includes(label.name.toLowerCase()));
            if (hasMatchingLabel && issue.state === "open") {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "✅ This issue was automatically closed because it has one of the following labels: completed, wontfix"
              });
            }
