name: Auto Close Issues

on:
  issues:
    types: [labeled, opened, reopened]

permissions:
  issues: write

jobs:
  close-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Close completed or wontfix issues
        uses: actions/github-script@v7
        with:
          script: |
            const labels = (context.payload.issue.labels || []).map(label => label.name);
            if (labels.includes("completed") || labels.includes("wontfix")) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                state: "closed"
              });
              core.info(`Closed issue #${context.payload.issue.number} with labels: ${labels.join(", ")}`);
            } else {
              core.info(`Issue #${context.payload.issue.number} left open with labels: ${labels.join(", ")}`);
            }
