name: Auto Close Labeled Issues

on:
  issues:
    types: [opened, labeled, reopened]

permissions:
  issues: write

jobs:
  auto-close:
    runs-on: ubuntu-latest
    steps:
      - name: Close issues labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          script: |
            if (context.payload.issue.state !== "open") { return; }
            const labels = context.payload.issue.labels.map(label => label.name);
            const target = labels.find(name => name === "completed" || name === "wontfix");
            if (!target) { return; }
            const reason = target === "wontfix" ? "not_planned" : "completed";
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: "closed", state_reason: reason });
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: "This issue was automatically closed because it was labeled " + target + "." });
