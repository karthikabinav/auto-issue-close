name: Automated Issue Closing

on:
  issues:
    types: [labeled, opened, reopened]

jobs:
  close-labeled-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issues labeled completed or wontfix
        uses: actions/github-script@v7
        with:
          script: |
            const labelsToClose = ['completed', 'wontfix'];
            const issueLabels = context.payload.issue.labels.map(l => l.name.toLowerCase());
            const shouldClose = issueLabels.some(l => labelsToClose.includes(l));
            const triggeredLabel = context.payload.label ? context.payload.label.name.toLowerCase() : null;
            if (shouldClose || labelsToClose.includes(triggeredLabel)) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed'
              });
              console.log(`Closed issue #${context.issue.number} due to label`);
            }
